version: '3.8'

services:
  # 1. Container Nginx (Web Server)
  webserver:
    image: nginx:alpine
    container_name: clinic_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../backend_api:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # 2. Container PHP/Laravel
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: clinic_php
    restart: unless-stopped
    volumes:
      - ../backend_api:/var/www/html

  # 3. Container Database (MySQL)
  db:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: clinic_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: secret_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
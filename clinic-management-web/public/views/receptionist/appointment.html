<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt lịch khám — Lễ tân</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/receptionist.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>Phòng Khám</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="checkin.html">Check-in bệnh nhân</a>
      <a href="appointment.html" class="active">Đặt lịch khám</a>
      <a href="patients.html">Hồ sơ bệnh nhân</a>
      <a href="payments.html">Thanh toán</a>
    </nav>
  </aside>

  <main class="main">
    <div class="header-bar">
      <h1>Đặt lịch khám mới</h1>
      <div class="user-info"></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3>Thông tin đặt lịch</h3>

        <!-- Ô tìm bệnh nhân -->
        <div class="form-group" style="position: relative;">
          <label>
            Bệnh nhân <span class="required">*</span>
            <a href="patients.html" style="float:right;font-size:13px;font-weight:normal">
              + Thêm bệnh nhân mới
            </a>
          </label>

          <div id="patientSearchWrapper" style="position: relative;">
            <input type="text" id="patientSearch"
                   placeholder="🔍 Nhập tên hoặc số điện thoại..."
                   autocomplete="off"
                   style="width:100%;padding:10px 12px;border:1px solid #dee2e6;border-radius:6px;font-size:14px">

            <button type="button" id="clearPatientBtn" onclick="clearSelectedPatient()"
                    style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;color:#6c757d;padding:4px 8px;border-radius:4px"
                    title="Chọn lại">✕</button>

            <div id="patientSuggestions"
                 style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #dee2e6;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);max-height:300px;overflow-y:auto;z-index:1000;margin-top:4px">
            </div>
          </div>

          <input type="hidden" id="maBn" value="">

          <div id="selectedPatientInfo"
               style="display:none;margin-top:8px;padding:10px 12px;background:#d1e7dd;border-left:4px solid #198754;border-radius:6px;font-size:13px">
          </div>
        </div>

        <div class="form-group">
          <label>Chuyên khoa <span class="required">*</span></label>
          <select id="maChuyenKhoa">
            <option value="">-- Chọn chuyên khoa --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ngày khám <span class="required">*</span></label>
          <input type="date" id="ngayKham">
        </div>

        <div class="form-group">
          <label>Khung giờ</label>
          <select id="maKhungGio">
            <option value="">-- Tự động chọn --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Điểm ưu tiên (0-10)</label>
          <input type="number" id="diemUuTien" value="0" min="0" max="10">
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary btn-lg" onclick="submitBooking()" id="btnSubmit">
            Đặt lịch
          </button>
          <button class="btn btn-outline btn-lg" onclick="resetForm()">🔄 Làm mới</button>
        </div>
      </div>

      <div class="card">
        <h3>Khung giờ trống</h3>
        <div id="slotsInfo" class="text-muted">
          <p>Chọn chuyên khoa + ngày để xem khung giờ trống.</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Lịch khám đã đặt gần đây</h3>
      <table>
        <thead>
          <tr>
            <th>STT</th><th>Bệnh nhân</th><th>Bác sĩ</th>
            <th>Ngày</th><th>Giờ</th><th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="recentTable">
          <tr><td colspan="6" class="text-center text-muted" style="padding:32px">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/receptionist.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let dsBenhNhan = [];
let dsChuyenKhoa = [];
let selectedPatient = null;
let searchTimeout = null;
let highlightedIndex = -1;
let currentSuggestions = [];

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  if (!auth.requireAuth(['LeTan', 'QuanTri'])) return;
  auth.renderUserInfo();

  document.getElementById('ngayKham').value = todayStr();

  await loadAllPatients();
  await loadChuyenKhoa();
  loadRecentBookings();

  document.getElementById('maChuyenKhoa').addEventListener('change', loadSlots);
  document.getElementById('ngayKham').addEventListener('change', loadSlots);

  setupPatientAutocomplete();
  console.log('✅ Autocomplete đã setup');
});

/* ============================================================
   LOAD DATA
   ============================================================ */
async function loadAllPatients() {
  const res = await api.get('/benh-nhan?per_page=200');
  if (res.status !== 'success') {
    console.error('Load bệnh nhân thất bại:', res.message);
    return;
  }
  dsBenhNhan = res.data?.data || [];
  console.log(`✅ Đã load ${dsBenhNhan.length} bệnh nhân`);
}

async function loadChuyenKhoa() {
  const res = await api.get('/chuyen-khoa');
  if (res.status !== 'success') return;
  dsChuyenKhoa = res.data;
  document.getElementById('maChuyenKhoa').innerHTML =
    '<option value="">-- Chọn chuyên khoa --</option>' +
    res.data.map(ck => `<option value="${ck.ma_chuyen_khoa}">${ck.ten_chuyen_khoa} (${ck.bac_si_count} BS)</option>`).join('');
}

/* ============================================================
   AUTOCOMPLETE
   ============================================================ */
function setupPatientAutocomplete() {
  const input = document.getElementById('patientSearch');
  if (!input) return;

  input.addEventListener('input', handlePatientInput);
  input.addEventListener('keydown', handlePatientKeyDown);
  input.addEventListener('focus', () => {
    if (selectedPatient) return;
    if (!input.value.trim() && dsBenhNhan.length > 0) showRecentPatients();
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#patientSearchWrapper')) {
      document.getElementById('patientSuggestions').style.display = 'none';
      highlightedIndex = -1;
    }
  });
}

function handlePatientInput() {
  const input = document.getElementById('patientSearch');
  const suggestions = document.getElementById('patientSuggestions');
  const keyword = input.value.trim().toLowerCase();

  if (selectedPatient) return;

  if (!keyword) {
    suggestions.style.display = 'none';
    return;
  }

  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => performSearch(keyword), 200);
}

function performSearch(keyword) {
  const suggestions = document.getElementById('patientSuggestions');

  const matches = dsBenhNhan.filter(bn => {
    const ten = (bn.ho_ten || '').toLowerCase();
    const sdt = (bn.so_dien_thoai || '').toLowerCase();
    const cccd = (bn.cccd || '').toLowerCase();
    return ten.includes(keyword) || sdt.includes(keyword) || cccd.includes(keyword);
  });

  currentSuggestions = matches.slice(0, 15);
  highlightedIndex = -1;

  if (currentSuggestions.length === 0) {
    suggestions.innerHTML = `<div class="suggestion-empty">
      🔍 Không tìm thấy "<b>${escapeHtml(keyword)}</b>"
      <br><a href="patients.html" class="btn-add-new">+ Thêm bệnh nhân mới</a>
    </div>`;
    suggestions.style.display = 'block';
    return;
  }

  suggestions.innerHTML = currentSuggestions.map((bn, idx) => `
    <div class="suggestion-item" data-index="${idx}" data-ma-bn="${bn.ma_bn}">
      <div class="info">
        <div class="name">${highlightKeyword(bn.ho_ten || '', keyword)}</div>
        <div class="meta">📞 ${highlightKeyword(bn.so_dien_thoai || '', keyword) || 'Chưa có SĐT'}</div>
      </div>
      <span class="badge-code">#${bn.ma_bn}</span>
    </div>
  `).join('');

  suggestions.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('click', () => selectPatient(parseInt(item.dataset.maBn)));
  });

  suggestions.style.display = 'block';
}

function showRecentPatients() {
  const suggestions = document.getElementById('patientSuggestions');
  const recent = [...dsBenhNhan].sort((a, b) => b.ma_bn - a.ma_bn).slice(0, 5);
  if (recent.length === 0) return;

  suggestions.innerHTML = `
    <div class="suggestion-header">Bệnh nhân gần đây</div>
    ${recent.map(bn => `
      <div class="suggestion-item" data-ma-bn="${bn.ma_bn}">
        <div class="info">
          <div class="name">${escapeHtml(bn.ho_ten)}</div>
          <div class="meta">📞 ${escapeHtml(bn.so_dien_thoai || 'Chưa có SĐT')}</div>
        </div>
        <span class="badge-code">#${bn.ma_bn}</span>
      </div>
    `).join('')}
  `;

  suggestions.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('click', () => selectPatient(parseInt(item.dataset.maBn)));
  });

  suggestions.style.display = 'block';
}

function handlePatientKeyDown(e) {
  const suggestions = document.getElementById('patientSuggestions');
  const items = suggestions.querySelectorAll('.suggestion-item');
  if (items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('highlighted', i === highlightedIndex));
    items[highlightedIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, -1);
    items.forEach((it, i) => it.classList.toggle('highlighted', i === highlightedIndex));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (highlightedIndex >= 0 && items[highlightedIndex]) {
      selectPatient(parseInt(items[highlightedIndex].dataset.maBn));
    }
  } else if (e.key === 'Escape') {
    suggestions.style.display = 'none';
  }
}

function selectPatient(maBn) {
  const bn = dsBenhNhan.find(x => x.ma_bn === maBn);
  if (!bn) return;

  selectedPatient = bn;
  document.getElementById('maBn').value = bn.ma_bn;

  const input = document.getElementById('patientSearch');
  input.value = bn.ho_ten;
  input.disabled = true;

  document.getElementById('clearPatientBtn').style.display = 'block';
  document.getElementById('patientSuggestions').style.display = 'none';

  const infoEl = document.getElementById('selectedPatientInfo');
  infoEl.innerHTML = `
    <strong>✅ Đã chọn: ${bn.ho_ten}</strong><br>
    <small>📞 ${bn.so_dien_thoai || 'Chưa có SĐT'}</small>
    ${bn.ngay_sinh ? `<small> · 🎂 ${api.formatDate(bn.ngay_sinh)}</small>` : ''}
  `;
  infoEl.style.display = 'block';
}

function clearSelectedPatient() {
  selectedPatient = null;
  document.getElementById('maBn').value = '';

  const input = document.getElementById('patientSearch');
  input.value = '';
  input.disabled = false;
  input.focus();

  document.getElementById('clearPatientBtn').style.display = 'none';
  document.getElementById('selectedPatientInfo').style.display = 'none';
  document.getElementById('patientSuggestions').style.display = 'none';
}

/* ============================================================
   HELPERS
   ============================================================ */
function highlightKeyword(text, keyword) {
  if (!text || !keyword) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedKw = escapeHtml(keyword);
  const regex = new RegExp(`(${escapeRegex(escapedKw)})`, 'gi');
  return escaped.replace(regex, '<mark>$1</mark>');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/* ============================================================
   FORM HANDLERS
   ============================================================ */
async function loadSlots() {
  const maCk = document.getElementById('maChuyenKhoa').value;
  const ngay = document.getElementById('ngayKham').value;
  const infoEl = document.getElementById('slotsInfo');
  const selKg = document.getElementById('maKhungGio');

  if (!maCk || !ngay) {
    infoEl.innerHTML = '<p class="text-muted">Chọn chuyên khoa + ngày để xem khung giờ trống.</p>';
    return;
  }

  infoEl.innerHTML = '<p class="text-muted">Đang tải...</p>';

  const res = await api.get(`/lich-kham/khung-gio-trong?ngay=${ngay}&ma_chuyen_khoa=${maCk}`);

  if (res.status !== 'success' || !res.data?.length) {
    infoEl.innerHTML = '<p class="text-danger">⚠️ Không còn khung giờ trống cho ngày này.</p>';
    selKg.innerHTML = '<option value="">-- Tự động chọn --</option>';
    return;
  }

  const slots = res.data;
  infoEl.innerHTML = `
    <p class="text-success mb-2">✅ Có <b>${slots.length}</b> khung giờ trống:</p>
    <table>
      <thead><tr><th>Giờ</th><th>Ca</th><th>Số BS trống</th></tr></thead>
      <tbody>${slots.map(s => `
        <tr>
          <td><b>${s.gio_bat_dau.slice(0,5)} - ${s.gio_ket_thuc.slice(0,5)}</b></td>
          <td>${s.ten_ca || '—'}</td>
          <td><span class="badge badge-success">${s.so_bac_si_trong}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;

  selKg.innerHTML = '<option value="">-- Tự động chọn --</option>' +
    slots.map(s => `<option value="${s.ma_khung_gio}">${s.gio_bat_dau.slice(0,5)} - ${s.gio_ket_thuc.slice(0,5)} (${s.so_bac_si_trong} BS)</option>`).join('');
}

async function submitBooking() {
  const maBn = document.getElementById('maBn').value;
  const maCk = document.getElementById('maChuyenKhoa').value;
  const ngay = document.getElementById('ngayKham').value;
  const maKg = document.getElementById('maKhungGio').value;
  const diemUuTien = document.getElementById('diemUuTien').value;
  const btn = document.getElementById('btnSubmit');

  if (!maBn) {
    document.getElementById('patientSearch').focus();
    return api.toast('Vui lòng chọn bệnh nhân', 'error');
  }
  if (!maCk) return api.toast('Vui lòng chọn chuyên khoa', 'error');
  if (!ngay) return api.toast('Vui lòng chọn ngày khám', 'error');

  const payload = {
    ma_bn: parseInt(maBn),
    ma_chuyen_khoa: parseInt(maCk),
    ngay_kham: ngay,
    diem_uu_tien: parseInt(diemUuTien) || 0,
  };
  if (maKg) payload.ma_khung_gio = parseInt(maKg);

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Đang đặt lịch...';

  const res = await api.post('/lich-kham', payload);

  if (res.status === 'success') {
    api.toast('✅ Đặt lịch thành công!', 'success');
    const d = res.data;
    alert(`ĐẶT LỊCH THÀNH CÔNG!\n\nBác sĩ: ${d.bac_si?.ho_ten}\nGiờ: ${d.khung_gio?.gio_bat_dau?.slice(0,5)} - ${d.khung_gio?.gio_ket_thuc?.slice(0,5)}\nNgày: ${d.ngay_kham}`);
    resetForm();
    loadSlots();
    loadRecentBookings();
  } else {
    api.toast(res.message || 'Đặt lịch thất bại', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '📅 Đặt lịch';
}

async function loadRecentBookings() {
  const tbody = document.getElementById('recentTable');
  tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr>';

  const res = await api.get('/lich-kham?per_page=10');
  if (res.status !== 'success' || !res.data?.data?.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Chưa có lịch nào</td></tr>';
    return;
  }

  tbody.innerHTML = res.data.data.map((item, i) => {
    const cls = statusBadgeClass(item.trang_thai);
    return `<tr>
      <td>${i+1}</td>
      <td>${item.benh_nhan?.ho_ten || '—'}</td>
      <td>${item.bac_si?.ho_ten || '—'}</td>
      <td>${item.ngay_kham || '—'}</td>
      <td>${item.khung_gio?.gio_bat_dau?.slice(0,5) || '—'}</td>
      <td><span class="badge ${cls}">${statusLabel(item.trang_thai)}</span></td>
    </tr>`;
  }).join('');
}

function resetForm() {
  clearSelectedPatient();
  document.getElementById('maChuyenKhoa').value = '';
  document.getElementById('ngayKham').value = todayStr();
  document.getElementById('maKhungGio').value = '';
  document.getElementById('diemUuTien').value = '0';
  document.getElementById('slotsInfo').innerHTML = '<p class="text-muted">Chọn chuyên khoa + ngày để xem khung giờ trống.</p>';
  document.getElementById('maKhungGio').innerHTML = '<option value="">-- Tự động chọn --</option>';
}
</script>
</body>
</html>

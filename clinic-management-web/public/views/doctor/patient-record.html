<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Phiên khám — Bác sĩ</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/doctor.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>Bác sĩ</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule.html">Lịch làm việc</a>
      <a href="patient-record.html" class="active">Phiên khám</a>
      <a href="medicines.html">Danh mục thuốc</a>
    </nav>
  </aside>

  <main class="main">
    <div class="header-bar">
      <h1>Phiên khám bệnh</h1>
      <div class="user-info"></div>
    </div>

    <div id="loading" class="card text-center" style="padding:60px">
      <span class="spinner spinner-dark spinner-lg"></span>
      <p class="mt-2 text-muted">Đang tải thông tin...</p>
    </div>

    <div id="content" class="hidden">

      <!-- Thông tin bệnh nhân -->
      <div class="card">
        <h3>Thông tin bệnh nhân</h3>
        <div class="grid grid-3" id="patientInfo"></div>
      </div>

      <!-- Chẩn đoán -->
      <div class="card">
        <h3>Chẩn đoán</h3>
        <div class="form-group">
          <label>Chẩn đoán sơ bộ</label>
          <textarea id="chanDoanSoBo" rows="2" placeholder="Nhập chẩn đoán sơ bộ..."></textarea>
        </div>
        <div class="form-group">
          <label>Chẩn đoán cuối cùng</label>
          <textarea id="chanDoanCuoiCung" rows="3" placeholder="Nhập chẩn đoán cuối cùng..."></textarea>
        </div>
        <div class="form-group">
          <label>Ghi chú y tế</label>
          <textarea id="ghiChuYTe" rows="2" placeholder="Ghi chú thêm..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveDiagnosis()">Lưu chẩn đoán</button>
      </div>

      <!-- Chỉ định dịch vụ -->
      <div class="card">
        <h3>Chỉ định dịch vụ cận lâm sàng</h3>
        <div class="form-inline mb-2">
          <select id="chonDichVu" style="flex:1;padding:8px 12px;border:1px solid #dee2e6;border-radius:6px">
            <option value="">-- Chọn dịch vụ --</option>
          </select>
          <button class="btn btn-primary" onclick="addService()">+ Thêm chỉ định</button>
        </div>
        <table>
          <thead>
            <tr><th>Tên dịch vụ</th><th>Đơn giá</th><th>Trạng thái</th><th></th></tr>
          </thead>
          <tbody id="serviceList"></tbody>
        </table>
      </div>

      <!-- Kê đơn thuốc -->
      <div class="card">
        <h3>Đơn thuốc</h3>
        <div class="form-inline mb-2">
          <select id="chonThuoc" style="flex:1;padding:8px 12px;border:1px solid #dee2e6;border-radius:6px">
            <option value="">-- Chọn thuốc --</option>
          </select>
          <button class="btn btn-primary" onclick="addMedicine()">+ Thêm thuốc</button>
        </div>
        <table>
          <thead>
            <tr><th>Thuốc</th><th>Số lượng</th><th>Liều lượng</th><th>Thành tiền</th><th></th></tr>
          </thead>
          <tbody id="medicineList"></tbody>
        </table>
        <p class="text-right mt-2" style="text-align:right">
          <b>Tổng tiền thuốc: <span id="tongTienThuoc" style="color:#0d6efd;font-size:18px">0đ</span></b>
        </p>
        <button class="btn btn-primary" onclick="savePrescription()">Lưu</button>
      </div>

      <!-- Hành động cuối -->
      <div class="card d-flex flex-between align-center">
        <a href="dashboard.html" class="btn btn-outline">← Về Dashboard</a>
        <button class="btn btn-success btn-lg" onclick="finishExam()">Hoàn thành phiên khám</button>
      </div>

    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/doctor.js"></script>
<script src="/js/patient-record.js"></script>
</body>
</html>

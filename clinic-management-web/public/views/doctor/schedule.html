<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch làm việc — Bác sĩ</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/doctor.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>Bác sĩ</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule.html" class="active">Lịch làm việc</a>
      <a href="patient-record.html">Phiên khám</a>
      <a href="medicines.html">Danh mục thuốc</a>
    </nav>
  </aside>

  <main class="main">
    <div class="header-bar">
      <h1>Lịch làm việc</h1>
      <div class="user-info"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Chọn ngày xem lịch</h3>
        <input type="date" id="filterDate" style="padding:8px 12px;border:1px solid #dee2e6;border-radius:6px">
      </div>

      <table>
        <thead>
          <tr><th>STT</th><th>Giờ</th><th>Bệnh nhân</th><th>Trạng thái</th><th>Hành động</th></tr>
        </thead>
        <tbody id="scheduleTable">
          <tr><td colspan="5" class="text-center text-muted" style="padding:32px">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/doctor.js"></script>
<script>

  document.addEventListener('DOMContentLoaded', async () => {
    if (!auth.requireAuth(['BacSi', 'QuanTri'])) return;
    auth.renderUserInfo();

    try {
      // 1. Tìm mã bác sĩ dựa vào tài khoản đang đăng nhập
      const user = auth.currentUser();
      if (user) {
          const resBs = await api.get('/bac-si');
          if (resBs.status === 'success') {
              // Dùng optional chaining ?. để tránh lỗi nếu data bị null
              const found = resBs.data?.find(bs => Number(bs.ma_tk) === Number(user.ma_tk));
              if (found) currentMaBs = found.ma_bs;
          }
      }

      const di = document.getElementById('filterDate');
      di.value = todayStr();
      di.addEventListener('change', loadSchedule);

      await loadSchedule(); // Gọi và chờ load xong
    } catch (error) {
      console.error("Lỗi khởi tạo trang lịch:", error);
      document.getElementById('scheduleTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Lỗi khởi tạo dữ liệu</td></tr>';
    }
  });

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function statusBadgeClass(status) {
    return { 'cho_thanh_toan': 'badge-warning', 'da_thanh_toan': 'badge-info', 'cho_kham': 'badge-doing', 'dang_kham': 'badge-doing', 'hoan_thanh': 'badge-done', 'huy': 'badge-cancel' }[status] || 'badge-wait';
  }
  function statusLabel(status) {
    return { 'cho_thanh_toan': 'Chờ thanh toán', 'da_thanh_toan': 'Đã thanh toán', 'cho_kham': 'Chờ khám', 'dang_kham': 'Đang khám', 'hoan_thanh': 'Hoàn thành', 'huy': 'Đã hủy' }[status] || status;
  }

  async function loadSchedule() {
    const date = document.getElementById('filterDate').value || todayStr();
    const tbody = document.getElementById('scheduleTable');
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Đang tải...</td></tr>';

    let url = `/lich-kham?ngay=${date}&per_page=100`;
    if (!currentMaBs) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Không xác định được tài khoản Bác sĩ!</td></tr>';
        return;
    }
    url += `&ma_bac_si=${currentMaBs}`;

    const res = await api.get(url);

    if (res.status !== 'success') {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Lỗi: ${res.message}</td></tr>`;
      return;
    }

    const data = res.data?.data || [];
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:32px">Không có lịch</td></tr>';
      return;
    }

    tbody.innerHTML = data.map((l, i) => {
      const bn = l.ho_so?.benh_nhan || {};
      const tg = l.thoi_gian_den_kham ? new Date(l.thoi_gian_den_kham) : null;
      const gio = tg ? tg.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '—';

      return `
        <tr>
          <td>${i+1}</td>
          <td><b>${gio}</b></td>
          <td>${bn.ho_ten || '—'}</td>
          <td><span class="badge ${statusBadgeClass(l.trang_thai)}">${statusLabel(l.trang_thai)}</span></td>
          <td>
            ${['cho_kham', 'dang_kham'].includes(l.trang_thai)
              ? `<button class="btn btn-primary btn-sm" onclick="openRecord(${l.ma_luot_kham})">📋 Khám</button>`
              : '—'}
          </td>
        </tr>
      `;
    }).join('');
  }

  function openRecord(maLuotKham) {
    window.location.href = `patient-record.html?lich=${maLuotKham}`;
  }
</script>
  <script src="/js/notification.js"></script>
</body>
</html>

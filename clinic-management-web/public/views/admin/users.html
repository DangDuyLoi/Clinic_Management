<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý tài khoản — Admin</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>⚙️ Quản trị</h2>
    <nav>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="users.html" class="active">👥 Tài khoản</a>
      <a href="doctors.html">👨‍⚕️ Bác sĩ</a>
      <a href="specialties.html">🏥 Chuyên khoa</a>
      <a href="services.html">💉 Dịch vụ</a>
      <a href="audit-log.html">📜 Nhật ký</a>
    </nav>
  </aside>

  <main class="main">
    <div class="header-bar">
      <h1>👥 Quản lý tài khoản</h1>
      <div class="user-info"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="d-flex gap-1" style="flex:1">
          <input type="text" id="searchInput" placeholder="🔍 Tìm theo tên đăng nhập..."
                 style="padding:8px 12px;border:1px solid #dee2e6;border-radius:6px;flex:1;max-width:350px">
          <select id="filterRole" style="padding:8px 12px;border:1px solid #dee2e6;border-radius:6px">
            <option value="">Tất cả vai trò</option>
            <option value="QuanTri">Quản trị viên</option>
            <option value="BacSi">Bác sĩ</option>
            <option value="LeTan">Lễ tân</option>
            <option value="BenhNhan">Bệnh nhân</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="openUserModal()">+ Thêm tài khoản</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th><th>Tên đăng nhập</th><th>Vai trò</th>
            <th>Trạng thái</th><th>Ngày tạo</th><th>Hành động</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="6" class="text-center text-muted" style="padding:32px">Đang tải...</td></tr>
        </tbody>
      </table>

      <div id="pagination" class="d-flex flex-between align-center mt-2" style="display:none">
        <span id="pageInfo" class="text-muted"></span>
        <div class="d-flex gap-1">
          <button class="btn btn-outline btn-sm" id="btnPrev" onclick="changePage(-1)">← Trước</button>
          <button class="btn btn-outline btn-sm" id="btnNext" onclick="changePage(1)">Sau →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="userModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Thêm tài khoản</h3>
      <button class="modal-close" onclick="closeUserModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f_ma_tk">
      <div class="form-group">
        <label>Tên đăng nhập <span class="required">*</span></label>
        <input type="text" id="f_ten_dang_nhap">
      </div>
      <div class="form-group">
        <label>Mật khẩu <span class="required" id="pwdHint">*</span></label>
        <input type="password" id="f_mat_khau" placeholder="Tối thiểu 6 ký tự">
        <small class="form-hint" id="pwdHintText"></small>
      </div>
      <div class="form-group">
        <label>Vai trò <span class="required">*</span></label>
        <select id="f_vai_tro">
          <option value="LeTan">Lễ tân</option>
          <option value="BacSi">Bác sĩ</option>
          <option value="BenhNhan">Bệnh nhân</option>
          <option value="QuanTri">Quản trị viên</option>
        </select>
      </div>
      <div class="form-group" id="trangThaiGroup" style="display:none">
        <label>Trạng thái</label>
        <select id="f_trang_thai">
          <option value="1">Hoạt động</option>
          <option value="0">Đã khóa</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeUserModal()">Hủy</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveUser()">Lưu</button>
    </div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/admin-users.js"></script>
</body>
</html>

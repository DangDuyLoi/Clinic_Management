<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý dịch vụ — Admin</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>⚙️ Quản trị</h2>
    <nav>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="users.html">👥 Tài khoản</a>
      <a href="doctors.html">👨‍⚕️ Bác sĩ</a>
      <a href="specialties.html">🏥 Chuyên khoa</a>
      <a href="services.html" class="active">💉 Dịch vụ</a>
      <a href="audit-log.html">📜 Nhật ký</a>
    </nav>
  </aside>

  <main class="main">
    <div class="header-bar">
      <h1>💉 Quản lý dịch vụ</h1>
      <div class="user-info"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <input type="text" id="searchInput" placeholder="🔍 Tìm dịch vụ..."
               style="padding:8px 12px;border:1px solid #dee2e6;border-radius:6px;width:300px">
        <button class="btn btn-primary" onclick="openServiceModal()">+ Thêm dịch vụ</button>
      </div>

      <table>
        <thead>
          <tr><th>Mã</th><th>Tên dịch vụ</th><th>Đơn giá</th><th>Mô tả</th><th>Hành động</th></tr>
        </thead>
        <tbody id="serviceTable">
          <tr><td colspan="5" class="text-center text-muted" style="padding:32px">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="serviceModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Thêm dịch vụ</h3>
      <button class="modal-close" onclick="closeServiceModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f_ma_dv">
      <div class="form-group">
        <label>Tên dịch vụ <span class="required">*</span></label>
        <input type="text" id="f_ten" placeholder="VD: Xét nghiệm máu">
      </div>
      <div class="form-group">
        <label>Đơn giá (VNĐ) <span class="required">*</span></label>
        <input type="number" id="f_gia" min="0" step="1000" placeholder="150000">
      </div>
      <div class="form-group">
        <label>Mô tả</label>
        <textarea id="f_mo_ta" rows="3" placeholder="Mô tả dịch vụ..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeServiceModal()">Hủy</button>
      <button class="btn btn-primary" onclick="saveService()">Lưu</button>
    </div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/admin-services.js"></script>
</body>
</html>
